spring:
  application:
    name: erp-auth-service-test
  # El perfil de test NO define datasource: la configuracion de la base de
  # datos la inyecta AbstractPostgresIntegrationTest, que arranca una
  # instancia real de PostgreSQL en proceso.
  #
  # Antes se usaba H2 con ddl-auto: create-drop y Flyway desactivado. Ese
  # perfil derivaba el esquema de las entidades, con lo que una migracion
  # alterada no se detectaba nunca y la restriccion NOT NULL de
  # user_roles.tenant_id no llegaba a ejecutarse.
  jpa:
    show-sql: false
  flyway:
    enabled: true

erp:
  security:
    jwt:
      issuer: https://auth.test.erp-automotriz.com
      access-token-expiration-minutes: 15
      refresh-token-expiration-days: 7
      password-reset-token-expiration-minutes: 30
      key-id: test-auth-key-v1
    rate-limit:
      max-failed-attempts: 5
      lock-duration-minutes: 15
