server:
  port: ${SERVER_PORT:8081}
  servlet:
    context-path: /

spring:
  application:
    name: erp-auth-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/erp_auth_db}
    username: ${SPRING_DATASOURCE_USERNAME:auth_user}
    password: ${SPRING_DATASOURCE_PASSWORD:auth_secret}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      pool-name: AuthHikariPool
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

# Configuración de Seguridad y JWT
erp:
  security:
    jwt:
      issuer: ${JWT_ISSUER:https://auth.erp-automotriz.com}
      access-token-expiration-minutes: ${JWT_ACCESS_TOKEN_EXPIRATION_MINUTES:15}
      refresh-token-expiration-days: ${JWT_REFRESH_TOKEN_EXPIRATION_DAYS:7}
      password-reset-token-expiration-minutes: ${JWT_PASSWORD_RESET_EXPIRATION_MINUTES:30}
      key-id: ${JWT_KEY_ID:erp-auth-key-2026-v1}
      private-key-pem: ${JWT_PRIVATE_KEY_PEM:}
      public-key-pem: ${JWT_PUBLIC_KEY_PEM:}
    rate-limit:
      max-failed-attempts: ${AUTH_MAX_FAILED_ATTEMPTS:5}
      lock-duration-minutes: ${AUTH_LOCK_DURATION_MINUTES:15}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

logging:
  level:
    root: INFO
    com.erp.auth: DEBUG
    org.springframework.security: INFO
