services:
  auth-postgres:
    image: 'postgres:16-alpine'
    container_name: erp-auth-postgres
    environment:
      - POSTGRES_DB=erp_auth_db
      - POSTGRES_USER=auth_user
      - POSTGRES_PASSWORD=${SPRING_FLYWAY_PASSWORD:?defina SPRING_FLYWAY_PASSWORD con la contrasena del rol propietario}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_auth_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U auth_user -d erp_auth_db']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_auth_data:
